services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: naxoresuelve
      POSTGRES_PASSWORD: naxoresuelve
      POSTGRES_DB: naxoresuelve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "naxoresuelve"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://naxoresuelve:naxoresuelve@db:5432/naxoresuelve

volumes:
  pgdata:
    driver: local
